<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Full Stack &amp; AI — Day 04</title>
  <style>
    :root{--ink:#292721;--paper:#fffaf0;--coral:#ef7355;--sun:#ffdc77;--mint:#c8ece2;--lilac:#e4d8f7;--purple:#7d64c2}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(rgba(92,74,46,.17) 1.1px,transparent 1.1px);background-size:23px 23px;font-family:"Avenir Next",Avenir,sans-serif}.page{width:min(1260px,calc(100% - 72px));min-height:100vh;margin:auto;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:35px;padding:64px 0}.kicker{font:700 1.08rem/1 "Bradley Hand","Comic Sans MS",cursive;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:24px}h1,h2{font-family:"Bradley Hand","Comic Sans MS",cursive;letter-spacing:-.04em}h1{font-size:clamp(4.4rem,9.2vw,8.7rem);line-height:.78;margin:0 0 31px}.accent{color:var(--coral)}p{max-width:780px;font-size:clamp(1.2rem,2vw,1.68rem);line-height:1.3;margin:0 0 16px}.about{margin-top:30px;padding:18px 20px;border:2.5px solid var(--ink);background:#fffdf6;box-shadow:5px 6px 0 rgba(41,39,33,.12)}.about h2{margin:0 0 8px;font-size:2rem}.about p{font-size:1.05rem}.start{display:inline-block;margin-top:24px;padding:17px 24px;border:2.5px solid var(--ink);box-shadow:5px 6px 0 var(--ink);background:var(--sun);color:var(--ink);text-decoration:none;font:700 clamp(1.4rem,2.3vw,2rem)/1 "Bradley Hand","Comic Sans MS",cursive}.portrait-wrap{position:relative;justify-self:end;width:min(100%,480px);padding:16px;border:2.5px solid var(--ink);background:#fffdf6;box-shadow:7px 8px 0 rgba(41,39,33,.15);transform:rotate(1.5deg)}.portrait-wrap:before{content:"";position:absolute;width:110px;height:32px;background:var(--coral);top:-17px;left:50%;transform:translateX(-50%) rotate(-4deg);opacity:.75}.portrait{display:block;width:100%;height:min(70vh,690px);object-fit:cover;object-position:65% center;background:var(--mint)}@media(max-width:820px){.page{grid-template-columns:1fr;padding:48px 0}.portrait-wrap{justify-self:start;width:min(100%,430px)}.portrait{height:auto;max-height:560px}.page{width:min(100% - 34px,1260px)}}
  </style>
</head>

    <figure class="portrait-wrap"><img class="portrait" src="./assets/gopikrishnan-illustrated.png" alt="Hand-drawn portrait of Gopikrishnan S"></figure>
  </main>
